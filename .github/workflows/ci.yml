name: ci

on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
    branches: [main]
    types: [labeled, opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit SHA to build (code only; keeps .github from dispatched ref)"
        required: false
        type: string
        default: ""
      build_target:
        description: "Target to build"
        required: true
        type: choice
        default: all
        options:
          - all
          - android

permissions: write-all

jobs:
  build:
    name: ${{ matrix.config.variant }} ${{ matrix.config.target }} ${{ matrix.config.v8_enable_pointer_compression && 'ptrcomp' || '' }} ${{ matrix.config.simdutf && 'simdutf' || '' }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 180
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_target == 'all' }}
    strategy:
      # Always run main branch builds to completion. This allows the cache to
      # stay mostly up-to-date in situations where a single job fails due to
      # e.g. a flaky test.
      # Don't fast-fail on tag build because publishing binaries shouldn't be
      # prevented if 'cargo publish' fails (which can be a false negative).
      fail-fast:
        ${{ (github.event_name == 'pull_request' || (github.ref !=
        'refs/heads/main' && !startsWith(github.ref, 'refs/tags/'))) &&
        !contains(github.event.pull_request.labels.*.name, 'no-fail-fast') }}
      matrix:
        config:
          - os: macos-15-large
            target: x86_64-apple-darwin
            variant: debug
            v8_enable_pointer_compression: false
            cargo: cargo

          - os: macos-15-large
            target: x86_64-apple-darwin
            variant: release
            v8_enable_pointer_compression: false
            cargo: cargo

          - os: macos-15-large
            target: x86_64-apple-darwin
            variant: debug
            v8_enable_pointer_compression: true
            cargo: cargo

          - os: macos-15-large
            target: x86_64-apple-darwin
            variant: release
            v8_enable_pointer_compression: true
            cargo: cargo

          - os: macos-15
            target: aarch64-apple-darwin
            variant: debug
            v8_enable_pointer_compression: false
            cargo: cargo

          - os: macos-15
            target: aarch64-apple-darwin
            variant: release
            v8_enable_pointer_compression: false
            cargo: cargo

          - os: macos-15
            target: aarch64-apple-darwin
            variant: debug
            v8_enable_pointer_compression: true
            cargo: cargo

          - os: macos-15
            target: aarch64-apple-darwin
            variant: release
            v8_enable_pointer_compression: true
            cargo: cargo

          - os: ${{ github.repository == 'denoland/rusty_v8' && 'ubuntu-22.04-xl' || 'ubuntu-22.04' }}
            target: x86_64-unknown-linux-gnu
            variant: debug
            v8_enable_pointer_compression: false
            cargo: cargo

          - os: ${{ github.repository == 'denoland/rusty_v8' && 'ubuntu-22.04-xl' || 'ubuntu-22.04' }}
            target: x86_64-unknown-linux-gnu
            variant: release
            v8_enable_pointer_compression: false
            cargo: cargo

          - os: ${{ github.repository == 'denoland/rusty_v8' && 'ubuntu-22.04-xl' || 'ubuntu-22.04' }}
            target: x86_64-unknown-linux-gnu
            variant: debug
            v8_enable_pointer_compression: true
            cargo: cargo

          - os: ${{ github.repository == 'denoland/rusty_v8' && 'ubuntu-22.04-xl' || 'ubuntu-22.04' }}
            target: x86_64-unknown-linux-gnu
            variant: release
            v8_enable_pointer_compression: true
            cargo: cargo

          - os: ${{ github.repository == 'denoland/rusty_v8' && 'windows-2022-xxl' || 'windows-2022' }}
            target: x86_64-pc-windows-msvc
            variant: release # Note: we do not support windows debug builds.
            v8_enable_pointer_compression: false
            cargo: cargo

          - os: ${{ github.repository == 'denoland/rusty_v8' && 'ubuntu-22.04-xl' || 'ubuntu-22.04' }}
            target: aarch64-unknown-linux-gnu
            variant: debug
            v8_enable_pointer_compression: false
            cargo: cargo

          - os: ${{ github.repository == 'denoland/rusty_v8' && 'ubuntu-22.04-xl' || 'ubuntu-22.04' }}
            target: aarch64-unknown-linux-gnu
            variant: release
            v8_enable_pointer_compression: false
            cargo: cargo

          # simdutf builds
          - os: macos-15-large
            target: x86_64-apple-darwin
            variant: debug
            v8_enable_pointer_compression: false
            simdutf: true
            cargo: cargo

          - os: macos-15-large
            target: x86_64-apple-darwin
            variant: release
            v8_enable_pointer_compression: false
            simdutf: true
            cargo: cargo

          - os: macos-15
            target: aarch64-apple-darwin
            variant: debug
            v8_enable_pointer_compression: false
            simdutf: true
            cargo: cargo

          - os: macos-15
            target: aarch64-apple-darwin
            variant: release
            v8_enable_pointer_compression: false
            simdutf: true
            cargo: cargo

          - os: ${{ github.repository == 'denoland/rusty_v8' && 'ubuntu-22.04-xl' || 'ubuntu-22.04' }}
            target: x86_64-unknown-linux-gnu
            variant: debug
            v8_enable_pointer_compression: false
            simdutf: true
            cargo: cargo

          - os: ${{ github.repository == 'denoland/rusty_v8' && 'ubuntu-22.04-xl' || 'ubuntu-22.04' }}
            target: x86_64-unknown-linux-gnu
            variant: release
            v8_enable_pointer_compression: false
            simdutf: true
            cargo: cargo

          - os: ${{ github.repository == 'denoland/rusty_v8' && 'ubuntu-22.04-xl' || 'ubuntu-22.04' }}
            target: aarch64-unknown-linux-gnu
            variant: debug
            v8_enable_pointer_compression: false
            simdutf: true
            cargo: cargo

          - os: ${{ github.repository == 'denoland/rusty_v8' && 'ubuntu-22.04-xl' || 'ubuntu-22.04' }}
            target: aarch64-unknown-linux-gnu
            variant: release
            v8_enable_pointer_compression: false
            simdutf: true
            cargo: cargo

          - os: ${{ github.repository == 'denoland/rusty_v8' && 'windows-2022-xxl' || 'windows-2022' }}
            target: x86_64-pc-windows-msvc
            variant: release # Note: we do not support windows debug builds.
            v8_enable_pointer_compression: false
            simdutf: true
            cargo: cargo

    env:
      V8_FROM_SOURCE: true
      CARGO_VARIANT_FLAG: ${{ matrix.config.variant == 'release' && '--release' || '' }}
      CARGO_FEATURE_FLAGS: ${{ format('{0} {1}', matrix.config.v8_enable_pointer_compression && '--features v8_enable_pointer_compression' || '', matrix.config.simdutf && '--features simdutf' || '') }}
      LIB_NAME: ${{ contains(matrix.config.target, 'windows') && 'rusty_v8' || 'librusty_v8' }}
      LIB_EXT: ${{ contains(matrix.config.target, 'windows') && 'lib' || 'a' }}
      FEATURES_SUFFIX: ${{ format('{0}{1}', matrix.config.v8_enable_pointer_compression && '_ptrcomp' || '', matrix.config.simdutf && '_simdutf' || '') }}
      RUSTFLAGS: -D warnings

    steps:
      - name: Configure git
        run: git config --global core.symlinks true

      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10
          submodules: recursive

      - name: Checkout selected source ref
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_ref != '' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.source_ref }}
          path: __source__
          fetch-depth: 1
          submodules: recursive

      - name: Overlay selected source ref (excluding .github)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_ref != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "Using source ref: ${{ github.event.inputs.source_ref }}"

          # Keep workflow/actions from the dispatch ref while replacing all other files.
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name __source__ \
            -exec rm -rf -- {} +
          tar --exclude='.github' -C __source__ -cf - . | tar -xf -
          rm -rf __source__

      - name: Install rust
        uses: dsherret/rust-toolchain-file@v1

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install nextest
        run: cargo binstall cargo-nextest --secure --locked --no-confirm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.x
          architecture: x64

      - name: Install cross compilation toolchain
        if: matrix.config.target == 'aarch64-unknown-linux-gnu'
        run: |
          rustup target add aarch64-unknown-linux-gnu

          sudo apt update
          sudo apt install -yq --no-install-suggests --no-install-recommends \
            binfmt-support g++-10-aarch64-linux-gnu g++-10-multilib \
            gcc-10-aarch64-linux-gnu libc6-arm64-cross qemu qemu-user \
            qemu-user-binfmt

          sudo ln -s /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1 \
                     /lib/ld-linux-aarch64.so.1

          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/aarch64-linux-gnu-gcc-10" >> ${GITHUB_ENV}
          echo "QEMU_LD_PREFIX=/usr/aarch64-linux-gnu" >> ${GITHUB_ENV}

      - name: Write git_submodule_status.txt
        run: git submodule status --recursive > git_submodule_status.txt

      - name: Cache
        uses: actions/cache@v4
        with:
          # Note: rusty_v8 targets always get get rebuilt, and their outputs
          # ('librusty_v8.rlib', the whole 'gn_out' directory, etc.) can be
          # quite big, so we cache only those subdirectories of
          # target/{debug|release} that contain the build output for crates that
          # come from the registry. By additionally saving the sccache cache
          # directory it's still possible to build v8 fast.
          path: |-
            target/sccache
            target/*/.*
            target/*/build
            target/*/deps
          key: cargo1-${{ matrix.config.target }}-${{ matrix.config.variant }}-${{ matrix.config.v8_enable_pointer_compression }}-${{ matrix.config.simdutf }}-${{ hashFiles('Cargo.lock', 'build.rs', 'git_submodule_status.txt') }}
          restore-keys: cargo1-${{ matrix.config.target }}-${{ matrix.config.variant }}-${{ matrix.config.v8_enable_pointer_compression }}-

      - name: Install and start sccache
        shell: pwsh
        env:
          SCCACHE_DIR: ${{ github.workspace }}/target/sccache
          SCCACHE_CACHE_SIZE: 256M
          SCCACHE_IDLE_TIMEOUT: 0
        run: |
          $version = "v0.8.2"
          $platform =
            @{ "x86_64-apple-darwin"       = "x86_64-apple-darwin"
               "aarch64-apple-darwin"      = "aarch64-apple-darwin"
               "x86_64-unknown-linux-gnu"  = "x86_64-unknown-linux-musl"
               "aarch64-unknown-linux-gnu" = "aarch64-unknown-linux-musl"
               "x86_64-pc-windows-msvc"    = "x86_64-pc-windows-msvc"
             }['${{ matrix.config.target }}']
          $basename = "sccache-$version-$platform"
          $url = "https://github.com/mozilla/sccache/releases/download/$version/$basename.tar.gz"
          cd ~
          curl -LO $url
          tar -xzvf "$basename.tar.gz"
          . $basename/sccache --start-server
          echo "$(pwd)/$basename" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Clang
        if: startsWith(matrix.config.os, 'ubuntu')
        run: |
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main" | sudo dd of=/etc/apt/sources.list.d/llvm-toolchain-jammy-19.list
          curl https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo dd of=/etc/apt/trusted.gpg.d/llvm-snapshot.gpg
          sudo apt-get update
          sudo apt-get -qq remove 'clang-*'
          sudo apt-get install lld-19 clang-19 clang-tools-19 clang-tidy-19 clang-format-19 libclang-19-dev -y
          echo "LIBCLANG_PATH=/usr/lib/llvm-19/lib" >> $GITHUB_ENV

      - name: Set LIBCLANG_PATH (macOS)
        if: startsWith(matrix.config.os, 'macos')
        run: |
          XCODE_CLANG_LIB="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          echo "LIBCLANG_PATH=$XCODE_CLANG_LIB" >> $GITHUB_ENV

      - name: check rust code formatting
        run: cargo fmt --check

      - name: check c++ code formatting
        if: startsWith(matrix.config.os, 'ubuntu')
        run: |
          clang-format-19 --verbose --Werror --dry-run src/*.cc src/*.hpp src/*.h

      - name: Test
        env:
          SCCACHE_IDLE_TIMEOUT: 0
        if: matrix.config.variant == 'debug' || matrix.config.variant == 'release'
        run: ${{ matrix.config.cargo }} nextest run -v --cargo-verbose --cargo-verbose --all-targets --locked --target ${{ matrix.config.target }} ${{ env.CARGO_VARIANT_FLAG }} ${{ env.CARGO_FEATURE_FLAGS }}

      - name: Clippy
        run: ${{ matrix.config.cargo }} clippy --all-targets --locked --target ${{ matrix.config.target }} ${{ env.CARGO_VARIANT_FLAG }} ${{ env.CARGO_FEATURE_FLAGS }} -- -D clippy::all

      - name: Prepare binary publish
        if: matrix.config.variant == 'debug' || matrix.config.variant == 'release'
        run: |
          gzip -9c target/${{ matrix.config.target }}/${{ matrix.config.variant }}/gn_out/obj/${{ env.LIB_NAME }}.${{ env.LIB_EXT }} > target/${{ env.LIB_NAME }}${{ env.FEATURES_SUFFIX }}_${{ matrix.config.variant }}_${{ matrix.config.target }}.${{ env.LIB_EXT }}.gz
          ls -l target/${{ env.LIB_NAME }}${{ env.FEATURES_SUFFIX }}_${{ matrix.config.variant }}_${{ matrix.config.target }}.${{ env.LIB_EXT }}.gz

          cp target/${{ matrix.config.target }}/${{ matrix.config.variant}}/gn_out/src_binding.rs target/src_binding${{ env.FEATURES_SUFFIX }}_${{ matrix.config.variant }}_${{ matrix.config.target }}.rs
          ls -l target/src_binding${{ env.FEATURES_SUFFIX }}_${{ matrix.config.variant }}_${{ matrix.config.target }}.rs

      - name: Binary publish
        uses: softprops/action-gh-release@v0.1.15
        if: >-
          github.repository == 'denoland/rusty_v8' &&
          startsWith(github.ref, 'refs/tags/') &&
          (matrix.config.variant == 'debug' || matrix.config.variant == 'release')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            target/${{ env.LIB_NAME }}${{ env.FEATURES_SUFFIX }}_${{ matrix.config.variant }}_${{ matrix.config.target }}.${{ env.LIB_EXT }}.gz
            target/src_binding${{ env.FEATURES_SUFFIX }}_${{ matrix.config.variant }}_${{ matrix.config.target }}.rs

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: src_binding${{ env.FEATURES_SUFFIX }}_${{ matrix.config.variant }}_${{ matrix.config.target }}.rs
          path: target/src_binding${{ env.FEATURES_SUFFIX }}_${{ matrix.config.variant }}_${{ matrix.config.target }}.rs

  build-android:
    name: release aarch64-linux-android
    runs-on: ${{ github.repository == 'denoland/rusty_v8' && 'ubuntu-22.04-xl' || 'ubuntu-22.04' }}
    timeout-minutes: 180
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'android') }}
    env:
      CARGO_VARIANT_FLAG: --release
      V8_FROM_SOURCE: true
      LIB_NAME: librusty_v8
      LIB_EXT: a
      FEATURES_SUFFIX: ''
      RUSTFLAGS: -D warnings

    steps:
      - name: Configure git
        run: git config --global core.symlinks true

      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10
          submodules: recursive

      - name: Checkout selected source ref
        if: ${{ github.event.inputs.source_ref != '' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.source_ref }}
          path: __source__
          fetch-depth: 1
          submodules: recursive

      - name: Overlay selected source ref (excluding .github)
        if: ${{ github.event.inputs.source_ref != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "Using source ref: ${{ github.event.inputs.source_ref }}"

          # Keep workflow/actions from the dispatch ref while replacing all other files.
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name __source__ \
            -exec rm -rf -- {} +
          tar --exclude='.github' -C __source__ -cf - . | tar -xf -
          rm -rf __source__

      - name: Install rust
        uses: dsherret/rust-toolchain-file@v1

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.x
          architecture: x64

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          add-to-path: false
          local-cache: true

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          mkdir -p third_party
          rm -rf third_party/android_ndk
          ln -s "${{ steps.setup-ndk.outputs.ndk-path }}" third_party/android_ndk
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${{ github.workspace }}/third_party/android_ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"

      - name: Write git_submodule_status.txt
        run: git submodule status --recursive > git_submodule_status.txt

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |-
            target/sccache
            target/*/.*
            target/*/build
            target/*/deps
          key: cargo1-aarch64-linux-android-release-false-${{ hashFiles('Cargo.lock', 'build.rs', 'git_submodule_status.txt') }}
          restore-keys: cargo1-aarch64-linux-android-release-false-

      - name: Install and start sccache
        shell: pwsh
        env:
          SCCACHE_DIR: ${{ github.workspace }}/target/sccache
          SCCACHE_CACHE_SIZE: 256M
          SCCACHE_IDLE_TIMEOUT: 0
        run: |
          $version = "v0.8.2"
          $platform = "x86_64-unknown-linux-musl"
          $basename = "sccache-$version-$platform"
          $url = "https://github.com/mozilla/sccache/releases/download/$version/$basename.tar.gz"
          cd ~
          curl -LO $url
          tar -xzvf "$basename.tar.gz"
          . $basename/sccache --start-server
          echo "$(pwd)/$basename" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Clang
        run: |
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main" | sudo dd of=/etc/apt/sources.list.d/llvm-toolchain-jammy-19.list
          curl https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo dd of=/etc/apt/trusted.gpg.d/llvm-snapshot.gpg
          sudo apt-get update
          sudo apt-get -qq remove 'clang-*'
          sudo apt-get install lld-19 clang-19 clang-tools-19 clang-tidy-19 clang-format-19 libclang-19-dev -y
          echo "LIBCLANG_PATH=/usr/lib/llvm-19/lib" >> $GITHUB_ENV

      - name: Build (cross-compile, no tests)
        env:
          SCCACHE_IDLE_TIMEOUT: 0
        run: cargo build -vv --locked --target aarch64-linux-android --release

      - name: Prepare binary publish
        run: |
          gzip -9c target/aarch64-linux-android/release/gn_out/obj/${{ env.LIB_NAME }}.${{ env.LIB_EXT }} > target/librusty_v8_release_aarch64-linux-android.a.gz
          ls -l target/librusty_v8_release_aarch64-linux-android.a.gz

          cp target/aarch64-linux-android/release/gn_out/src_binding.rs target/src_binding_release_aarch64-linux-android.rs
          ls -l target/src_binding_release_aarch64-linux-android.rs

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: src_binding_release_aarch64-linux-android.rs
          path: target/src_binding_release_aarch64-linux-android.rs

      - name: Upload Android prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-prebuilt-release-aarch64-linux-android
          path: |
            target/librusty_v8_release_aarch64-linux-android.a.gz
            target/src_binding_release_aarch64-linux-android.rs

  build-asan:
    name: asan aarch64-apple-darwin
    runs-on: macos-15
    timeout-minutes: 180
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_target == 'all' }}
    env:
      V8_FROM_SOURCE: true
      RUSTFLAGS: -D warnings

    steps:
      - name: Configure git
        run: git config --global core.symlinks true

      - name: Clone repository
